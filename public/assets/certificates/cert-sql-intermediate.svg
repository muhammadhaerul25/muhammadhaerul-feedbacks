  <text x="400" y="292" font-family="'Google Sans', 'Inter', sans-serif" font-size="22" font-weight="800" fill="url(#grad-HACKERRANK-SQL-INT-MH)" text-anchor="middle">SQL (Intermediate) Certificate</text>

