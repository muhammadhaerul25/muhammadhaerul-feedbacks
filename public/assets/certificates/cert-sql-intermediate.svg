  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" rx="14" fill="#FFFFFF"/>
  <rect x="12" y="12" width="776" height="496" rx="10" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Ornate Decorative Frame -->
  <rect x="24" y="24" width="752" height="472" rx="6" fill="none" stroke="url(#grad-HACKERRANK-SQL-INT-MH)" stroke-width="3" stroke-dasharray="16 4"/>
  <rect x="30" y="30" width="740" height="460" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Corner Flourishes -->
  <circle cx="36" cy="36" r="6" fill="url(#grad-HACKERRANK-SQL-INT-MH)"/>
  <circle cx="764" cy="36" r="6" fill="url(#grad-HACKERRANK-SQL-INT-MH)"/>
  <circle cx="36" cy="484" r="6" fill="url(#grad-HACKERRANK-SQL-INT-MH)"/>
  <circle cx="764" cy="484" r="6" fill="url(#grad-HACKERRANK-SQL-INT-MH)"/>

