<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Form…</title>
    <meta name="description" content="Fill out this form.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --primary: #4285F4;
        --ink: #202124;
        --ink-2: #3C4043;
        --ink-3: #5F6368;
        --ink-4: #9AA0A6;
        --border: #DADCE0;
        --bg: #F0F4FF;
        --surface: #FFFFFF;
        --g-green: #34A853;
        --g-red: #EA4335;
        --g-yellow: #FBBC04;
        --r-md: 14px;
        --r-sm: 10px;
        --r-pill: 100px;
        --t: 0.22s cubic-bezier(0.4,0,0.2,1);
        --t-spring: 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 16px 48px;
        background-image:
            radial-gradient(ellipse 600px 400px at 0% 0%, rgba(66,133,244,0.08) 0%, transparent 60%),
            radial-gradient(ellipse 400px 300px at 100% 100%, rgba(52,168,83,0.06) 0%, transparent 60%);
    }

    /* ── LOADING ── */
    #loading-state {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; min-height: 60vh; width: 100%;
    }
    .loader {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; color: var(--ink-3); font-weight: 600; }

    /* ── ERROR STATE ── */
    #error-state {
        display: none; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; min-height: 60vh; width: 100%; text-align: center;
    }
    .error-icon { font-size: 4rem; }
    .error-title { font-size: 1.4rem; font-weight: 800; color: var(--ink); }
    .error-desc { font-size: 0.9rem; color: var(--ink-3); max-width: 300px; line-height: 1.6; }

    /* ── FORM CARD ── */
    #form-card {
        display: none;
        background: var(--surface);
        max-width: 580px;
        width: 100%;
        border-radius: 20px;
        box-shadow: 0 4px 24px rgba(60,64,67,0.12);
        overflow: hidden;
        position: relative;
    }

    .form-header {
        padding: 32px 36px 28px;
        position: relative;
        overflow: hidden;
    }
    .form-header::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.25) 100%);
    }
    .form-header-content { position: relative; z-index: 1; }

    .form-badge {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 4px 12px; border-radius: var(--r-pill);
        background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
        font-size: 0.68rem; font-weight: 800; color: #fff;
        text-transform: uppercase; letter-spacing: 0.08em;
        margin-bottom: 12px;
    }
    .form-title-display {
        font-family: 'Google Sans', 'Inter', sans-serif;
        font-size: 1.8rem; font-weight: 700;
        color: #fff; letter-spacing: -0.03em; line-height: 1.2;
        margin-bottom: 8px;
    }
    .form-desc-display {
        font-size: 0.9rem; color: rgba(255,255,255,0.8);
        line-height: 1.5;
    }

    .form-body { padding: 32px 36px 36px; }

    /* ── PROGRESS BAR ── */
    .progress-bar-wrap { margin-bottom: 28px; }
    .progress-track {
        height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
        height: 100%; border-radius: 2px;
        transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .progress-label {
        font-size: 0.72rem; font-weight: 700; color: var(--ink-4);
        margin-top: 8px; text-align: right;
    }

    /* ── FIELDS ── */
    .field-group { margin-bottom: 22px; }
    .field-label {
        display: block; font-size: 0.82rem; font-weight: 700;
        color: var(--ink-2); margin-bottom: 8px;
    }
    .field-label .req { color: var(--g-red); margin-left: 2px; }

    .field-input, .field-textarea, .field-select {
        width: 100%; padding: 12px 16px;
        font-family: inherit; font-size: 0.9rem; font-weight: 500; color: var(--ink);
        background: #FAFAFA; border: 1.5px solid var(--border);
        border-radius: var(--r-md); outline: none; transition: var(--t);
        appearance: none;
    }
    .field-input:focus, .field-textarea:focus, .field-select:focus {
        border-color: var(--primary); background: var(--surface);
        box-shadow: 0 0 0 3px rgba(66,133,244,0.12);
    }
    .field-input::placeholder, .field-textarea::placeholder { color: var(--ink-4); }
    .field-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
    .field-select-wrap { position: relative; }
    .field-select-wrap::after {
        content: '';
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        border: 5px solid transparent; border-top: 6px solid var(--ink-4);
        pointer-events: none;
    }
    .field-select { cursor: pointer; padding-right: 36px; }

    /* ── RATING ── */
    .rating-grid {
        display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 4px;
    }
    .rating-grid + .rating-grid { margin-top: 0; }
    input[type="radio"].r-inp { display: none; }
    .r-lbl {
        display: flex; align-items: center; justify-content: center;
        height: 46px; border: 2px solid var(--border);
        border-radius: var(--r-sm);
        font-size: 1rem; font-weight: 800; color: var(--ink-3);
        cursor: pointer; transition: var(--t-spring); user-select: none;
    }
    .r-lbl:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px) scale(1.05); }

    /* Radio options */
    .radio-options { display: flex; flex-direction: column; gap: 10px; }
    .radio-option {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px; border: 1.5px solid var(--border);
        border-radius: var(--r-md); cursor: pointer; transition: var(--t);
    }
    .radio-option:hover { border-color: var(--primary); background: rgba(66,133,244,0.04); }
    .radio-option input[type="radio"] { display: none; }
    .radio-dot {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid var(--border); flex-shrink: 0;
        transition: var(--t); display: flex; align-items: center; justify-content: center;
    }
    .radio-option.selected { border-color: var(--primary); background: rgba(66,133,244,0.06); }
    .radio-option.selected .radio-dot { border-color: var(--primary); background: var(--primary); }
    .radio-option.selected .radio-dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
    .radio-option-label { font-size: 0.9rem; font-weight: 600; color: var(--ink-2); }

    /* ── BUTTONS ── */
    .nav-btns { display: flex; gap: 10px; margin-top: 28px; }
    .btn {
        flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 13px 20px; font-family: inherit; font-size: 0.9rem; font-weight: 700;
        border: none; border-radius: var(--r-pill); cursor: pointer; transition: var(--t);
    }
    .btn svg { width: 15px; height: 15px; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(66,133,244,0.3); }
    .btn-primary:hover { background: #3367D6; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(66,133,244,0.4); }
    .btn-primary:disabled { background: #AEC8FF; box-shadow: none; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #F1F3F4; color: var(--ink-2); flex: none; width: auto; padding: 13px 22px; }
    .btn-secondary:hover { background: var(--border); }

    .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }

    /* ── ALERT ── */
    .alert {
        padding: 12px 16px; border-radius: var(--r-md);
        font-size: 0.85rem; font-weight: 600;
        margin-bottom: 20px; display: none; align-items: center; gap: 10px;
    }
    .alert.error   { display: flex; background: #FDE8E7; color: #C5221F; border: 1px solid #FACBC9; }
    .alert.success { display: flex; background: #E6F4EA; color: #137333; border: 1px solid #A8D5B5; }

    /* ── SUCCESS STATE ── */
    #success-state {
        display: none; text-align: center; padding: 48px 36px 40px;
        position: relative;
    }
    .confetti-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .confetti-piece {
        position: absolute; border-radius: 2px; opacity: 0;
        animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
        0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
    }
    .success-ring {
        width: 80px; height: 80px; border-radius: 50%;
        background: linear-gradient(135deg, var(--g-green), #1E8A3E);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 8px 28px rgba(52,168,83,0.3);
        animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        position: relative; z-index: 1;
    }
    @keyframes popIn { from{transform:scale(0.4);opacity:0} to{transform:scale(1);opacity:1} }
    .success-ring svg { width: 38px; height: 38px; color: #fff; }
    .success-title {
        font-family: 'Google Sans', 'Inter', sans-serif;
        font-size: 1.6rem; font-weight: 700; color: var(--ink);
        letter-spacing: -0.03em; margin-bottom: 10px;
        animation: fadeUp 0.4s 0.2s both; position: relative; z-index: 1;
    }
    .success-desc {
        font-size: 0.88rem; color: var(--ink-3); line-height: 1.6;
        margin-bottom: 28px; animation: fadeUp 0.4s 0.3s both;
        position: relative; z-index: 1;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    #btn-again {
        animation: fadeUp 0.4s 0.4s both; flex: none;
        width: auto; padding: 11px 26px;
        position: relative; z-index: 1;
    }

    /* ── FOOTER ── */
    .form-footer {
        padding: 14px 36px; border-top: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .footer-dots { display: flex; gap: 3px; }
    .footer-dot { width: 6px; height: 6px; border-radius: 50%; }
    .footer-text { font-size: 0.68rem; font-weight: 600; color: var(--ink-4); }

    /* ── RATING COLOR STATES ── */
    input.r-inp[value="1"]:checked~label,input.r-inp[value="2"]:checked~label{background:var(--g-red);border-color:var(--g-red);color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 6px 16px rgba(234,67,53,0.35)}
    input.r-inp[value="3"]:checked~label,input.r-inp[value="4"]:checked~label{background:#FF7043;border-color:#FF7043;color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 6px 16px rgba(255,112,67,0.35)}
    input.r-inp[value="5"]:checked~label,input.r-inp[value="6"]:checked~label{background:var(--g-yellow);border-color:var(--g-yellow);color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 6px 16px rgba(251,188,4,0.35)}
    input.r-inp[value="7"]:checked~label,input.r-inp[value="8"]:checked~label{background:#00BFA5;border-color:#00BFA5;color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 6px 16px rgba(0,191,165,0.35)}
    input.r-inp[value="9"]:checked~label,input.r-inp[value="10"]:checked~label{background:var(--g-green);border-color:var(--g-green);color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 6px 16px rgba(52,168,83,0.35)}

    @media (max-width: 480px) {
        body { padding: 16px; }
        .form-header, .form-body { padding: 24px 20px; }
        .form-footer { padding: 14px 20px; }
        .form-title-display { font-size: 1.4rem; }
        .nav-btns { flex-direction: column; }
        .btn-secondary { order: 2; }
    }
    </style>
</head>
<body>

<!-- LOADING -->
<div id="loading-state">
    <div class="loader"></div>
    <div class="loading-text">Loading form…</div>
</div>

<!-- ERROR -->
<div id="error-state">
    <div class="error-icon">🔍</div>
    <div class="error-title">Form Not Found</div>
    <div class="error-desc" id="error-msg">This form doesn't exist or has been removed.</div>
</div>

<!-- FORM CARD -->
<div id="form-card">
    <!-- Header (color + title) -->
    <div class="form-header" id="form-header">
        <div class="form-header-content">
            <div class="form-badge" id="form-badge">📝 Form</div>
            <div class="form-title-display" id="form-title-display">Loading…</div>
            <div class="form-desc-display" id="form-desc-display"></div>
        </div>
    </div>

    <!-- SUCCESS -->
    <div id="success-state">
        <div class="confetti-wrap" id="confetti-wrap"></div>
        <div class="success-ring" style="position:relative;z-index:1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="success-title" id="success-name">Response Submitted! 🎉</div>
        <div class="success-desc">Thank you for your feedback. Your response has been recorded successfully.</div>
        <button id="btn-again" class="btn btn-secondary" onclick="resetForm()">Submit another response</button>
    </div>

    <!-- FORM BODY -->
    <div id="form-body" class="form-body">
        <div id="alert-box" class="alert"></div>

        <!-- Progress -->
        <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <div class="progress-label" id="progress-label">Question 0 of 0</div>
        </div>

        <!-- Dynamic fields render here -->
        <div id="fields-container"></div>

        <div class="nav-btns" id="nav-btns">
            <button class="btn btn-secondary" id="btn-back" onclick="prevPage()" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back
            </button>
            <button class="btn btn-primary" id="btn-next" onclick="nextPage()">
                <span id="btn-next-text">Continue</span>
                <svg id="btn-next-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                <div class="spinner" id="btn-spinner"></div>
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="form-footer" id="form-footer">
        <div class="footer-dots">
            <div class="footer-dot" style="background:#4285F4"></div>
            <div class="footer-dot" style="background:#EA4335"></div>
            <div class="footer-dot" style="background:#FBBC04"></div>
            <div class="footer-dot" style="background:#34A853"></div>
        </div>
        <div class="footer-text">Muhammad Haerul's Portfolio · 2026</div>
    </div>
</div>

<script>
/* ════════════════════
   STATE
════════════════════ */
var formData = null;     // form + fields from API
var answers  = {};       // { fieldId: value }
var PAGE_SIZE = 3;       // fields per page
var currentPage = 0;
var pages = [];          // array of field arrays

var SLUG = window.location.pathname.replace(/^\/form\//, '').replace(/\/$/, '');

/* ════════════════════
   INIT
════════════════════ */
window.addEventListener('DOMContentLoaded', function() {
    if (!SLUG) { showError('No form specified.'); return; }
    loadForm();
});

async function loadForm() {
    try {
        var res  = await fetch('/api/forms/' + SLUG);
        var json = await res.json();
        if (!res.ok || !json.success) { showError(json.error || 'Form not found.'); return; }

        formData = json.data;
        document.title = formData.title + ' — Muhammad Haerul';

        // Set header
        var hdr = document.getElementById('form-header');
        hdr.style.background = 'linear-gradient(135deg, ' + formData.color + ' 0%, ' + darken(formData.color, 30) + ' 100%)';
        document.getElementById('progress-fill').style.background = formData.color;
        document.getElementById('form-title-display').textContent = formData.title;
        document.getElementById('form-desc-display').textContent = formData.description || '';
        if (!formData.description) document.getElementById('form-desc-display').style.display = 'none';

        // Build pages
        var fields = formData.fields || [];
        if (fields.length === 0) { showError('This form has no questions yet.'); return; }

        // Paginate: group into pages of PAGE_SIZE
        pages = [];
        for (var i = 0; i < fields.length; i += PAGE_SIZE) {
            pages.push(fields.slice(i, i + PAGE_SIZE));
        }

        if (pages.length > 1) document.getElementById('progress-wrap').style.display = 'block';

        // Check if already submitted
        var storageKey = 'form_submitted_' + SLUG;
        if (localStorage.getItem(storageKey) === 'true') {
            showSuccessState('');
            return;
        }

        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('form-card').style.display = 'block';
        renderPage(0);
    } catch(e) {
        console.error(e);
        showError('Failed to load form. Please try again.');
    }
}

/* ════════════════════
   RENDERING
════════════════════ */
function renderPage(idx) {
    currentPage = idx;
    var container = document.getElementById('fields-container');
    var pageFields = pages[idx];
    container.innerHTML = '';

    pageFields.forEach(function(field) {
        container.appendChild(buildField(field));
    });

    // Update progress
    var totalFields = formData.fields.length;
    var doneFields  = Math.min(idx * PAGE_SIZE + PAGE_SIZE, totalFields);
    document.getElementById('progress-fill').style.width = (doneFields / totalFields * 100) + '%';
    document.getElementById('progress-label').textContent = 'Question ' + Math.min(doneFields, totalFields) + ' of ' + totalFields;

    // Back button
    document.getElementById('btn-back').style.display = idx > 0 ? 'flex' : 'none';

    // Next/Submit button
    var isLast = idx === pages.length - 1;
    document.getElementById('btn-next-text').textContent = isLast ? 'Submit' : 'Continue';
    var nextIcon = document.getElementById('btn-next-icon');
    nextIcon.style.display = isLast ? 'none' : '';

    clearAlert();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildField(field) {
    var group = document.createElement('div');
    group.className = 'field-group';
    group.dataset.fieldId = field.id;

    var label = document.createElement('label');
    label.className = 'field-label';
    label.innerHTML = escHtml(field.label) + (field.required ? ' <span class="req">*</span>' : '');
    group.appendChild(label);

    var savedVal = answers[field.id] || '';

    switch (field.type) {
        case 'text':
        case 'email':
        case 'number':
            var inp = document.createElement('input');
            inp.type = field.type;
            inp.className = 'field-input';
            inp.placeholder = field.placeholder || '';
            inp.value = savedVal;
            inp.dataset.fieldId = field.id;
            inp.addEventListener('input', function(){ answers[field.id] = this.value; });
            label.setAttribute('for', 'f_' + field.id);
            inp.id = 'f_' + field.id;
            group.appendChild(inp);
            break;

        case 'textarea':
            var ta = document.createElement('textarea');
            ta.className = 'field-textarea';
            ta.placeholder = field.placeholder || '';
            ta.value = savedVal;
            ta.dataset.fieldId = field.id;
            ta.addEventListener('input', function(){ answers[field.id] = this.value; });
            label.setAttribute('for', 'f_' + field.id);
            ta.id = 'f_' + field.id;
            group.appendChild(ta);
            break;

        case 'select':
            var opts = [];
            try { opts = JSON.parse(field.options || '[]'); } catch(e) { opts = []; }
            var sw = document.createElement('div'); sw.className = 'field-select-wrap';
            var sel = document.createElement('select');
            sel.className = 'field-select';
            sel.dataset.fieldId = field.id;
            sel.id = 'f_' + field.id;
            sel.innerHTML = '<option value="">— Select an option —</option>' +
                opts.map(function(o){ return '<option value="'+escHtml(o)+'"'+(savedVal===o?' selected':'')+'>'+escHtml(o)+'</option>'; }).join('');
            sel.addEventListener('change', function(){ answers[field.id] = this.value; });
            sw.appendChild(sel); group.appendChild(sw);
            label.setAttribute('for', 'f_' + field.id);
            break;

        case 'radio':
            var rOpts = [];
            try { rOpts = JSON.parse(field.options || '[]'); } catch(e) { rOpts = []; }
            var rDiv = document.createElement('div'); rDiv.className = 'radio-options';
            rOpts.forEach(function(opt) {
                var row = document.createElement('div');
                row.className = 'radio-option' + (savedVal === opt ? ' selected' : '');
                row.innerHTML = '<div class="radio-dot">' + (savedVal===opt?'<div style="width:6px;height:6px;border-radius:50%;background:#fff"></div>':'') + '</div><span class="radio-option-label">'+escHtml(opt)+'</span>';
                row.addEventListener('click', function() {
                    answers[field.id] = opt;
                    rDiv.querySelectorAll('.radio-option').forEach(function(r){ r.classList.remove('selected'); r.querySelector('.radio-dot').innerHTML = ''; });
                    this.classList.add('selected');
                    this.querySelector('.radio-dot').innerHTML = '<div style="width:6px;height:6px;border-radius:50%;background:#fff"></div>';
                });
                rDiv.appendChild(row);
            });
            group.appendChild(rDiv);
            break;

        case 'rating':
            var rGrid = document.createElement('div');
            rGrid.className = 'rating-grid';
            rGrid.style.gridTemplateColumns = 'repeat(5, 1fr)';
            var rGrid2 = document.createElement('div');
            rGrid2.className = 'rating-grid';
            rGrid2.style.marginTop = '8px';
            rGrid2.style.gridTemplateColumns = 'repeat(5, 1fr)';

            [1,2,3,4,5].forEach(function(n) {
                var ri = document.createElement('input');
                ri.type='radio'; ri.className='r-inp'; ri.name='r_'+field.id; ri.id='r_'+field.id+'_'+n; ri.value=n;
                if (savedVal == n) ri.checked = true;
                ri.addEventListener('change', function(){ answers[field.id] = this.value; });
                var rl = document.createElement('label');
                rl.className = 'r-lbl'; rl.setAttribute('for','r_'+field.id+'_'+n); rl.textContent = n;
                rGrid.appendChild(ri); rGrid.appendChild(rl);
            });
            [6,7,8,9,10].forEach(function(n) {
                var ri = document.createElement('input');
                ri.type='radio'; ri.className='r-inp'; ri.name='r_'+field.id; ri.id='r_'+field.id+'_'+n; ri.value=n;
                if (savedVal == n) ri.checked = true;
                ri.addEventListener('change', function(){ answers[field.id] = this.value; });
                var rl = document.createElement('label');
                rl.className = 'r-lbl'; rl.setAttribute('for','r_'+field.id+'_'+n); rl.textContent = n;
                rGrid2.appendChild(ri); rGrid2.appendChild(rl);
            });

            var zoneRow = document.createElement('div');
            zoneRow.style = 'display:flex;justify-content:space-between;font-size:0.68rem;font-weight:700;color:var(--ink-4);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em';
            zoneRow.innerHTML = '<span>😞 Poor</span><span>😊 Excellent</span>';
            group.appendChild(zoneRow);
            group.appendChild(rGrid);
            group.appendChild(rGrid2);
            break;

        default:
            var def = document.createElement('input');
            def.type = 'text'; def.className = 'field-input';
            def.placeholder = field.placeholder || '';
            def.value = savedVal;
            def.addEventListener('input', function(){ answers[field.id] = this.value; });
            group.appendChild(def);
    }

    return group;
}

/* ════════════════════
   NAVIGATION
════════════════════ */
function nextPage() {
    clearAlert();
    // Validate current page
    var pageFields = pages[currentPage];
    for (var i = 0; i < pageFields.length; i++) {
        var f = pageFields[i];
        if (f.required && !answers[f.id]) {
            showAlert('Please complete "' + f.label + '" before continuing.', 'error');
            return;
        }
        if (f.type === 'email' && answers[f.id] && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(answers[f.id])) {
            showAlert('Please enter a valid email address.', 'error');
            return;
        }
    }

    var isLast = currentPage === pages.length - 1;
    if (isLast) {
        submitForm();
    } else {
        renderPage(currentPage + 1);
    }
}

function prevPage() {
    if (currentPage > 0) renderPage(currentPage - 1);
}

/* ════════════════════
   SUBMIT
════════════════════ */
async function submitForm() {
    var btn = document.getElementById('btn-next');
    var txt = document.getElementById('btn-next-text');
    var spinner = document.getElementById('btn-spinner');
    var icon = document.getElementById('btn-next-icon');

    btn.disabled = true;
    txt.style.display = 'none';
    icon.style.display = 'none';
    spinner.style.display = 'block';

    try {
        var res = await fetch('/api/forms/' + SLUG + '/responses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: answers })
        });
        var json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.error || 'Submission failed.');

        localStorage.setItem('form_submitted_' + SLUG, 'true');
        showSuccessState('');
    } catch(e) {
        console.error(e);
        showAlert('Submission failed: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        txt.style.display = 'block';
        spinner.style.display = 'none';
        if (currentPage < pages.length - 1) icon.style.display = '';
    }
}

/* ════════════════════
   SUCCESS
════════════════════ */
function showSuccessState(name) {
    document.getElementById('form-body').style.display = 'none';
    var ss = document.getElementById('success-state');
    ss.style.display = 'block';
    if (name) document.getElementById('success-name').textContent = 'Thank you, ' + name + '! 🎉';
    launchConfetti();
}

function launchConfetti() {
    var wrap = document.getElementById('confetti-wrap');
    wrap.innerHTML = '';
    var colors = ['#4285F4','#34A853','#FBBC04','#EA4335','#9C27B0','#FF5722'];
    for (var i = 0; i < 50; i++) {
        var p = document.createElement('div');
        p.className = 'confetti-piece';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = '-10px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.width  = (Math.random() * 8 + 5) + 'px';
        p.style.height = (Math.random() * 8 + 5) + 'px';
        p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        p.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        p.style.animationDelay    = (Math.random() * 0.8) + 's';
        wrap.appendChild(p);
    }
}

function resetForm() {
    localStorage.removeItem('form_submitted_' + SLUG);
    answers = {};
    document.getElementById('success-state').style.display = 'none';
    document.getElementById('form-body').style.display = 'block';
    renderPage(0);
}

/* ════════════════════
   HELPERS
════════════════════ */
function showError(msg) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display   = 'flex';
    document.getElementById('error-msg').textContent = msg;
}

function showAlert(msg, type) {
    var box = document.getElementById('alert-box');
    box.textContent = msg;
    box.className = 'alert ' + type;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function clearAlert() {
    document.getElementById('alert-box').className = 'alert';
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function darken(hex, amount) {
    var num = parseInt(hex.replace('#',''), 16);
    var r = Math.max(0, (num >> 16) - amount);
    var g = Math.max(0, ((num >> 8) & 0xFF) - amount);
    var b = Math.max(0, (num & 0xFF) - amount);
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
